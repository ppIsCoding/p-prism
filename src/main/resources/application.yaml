spring:
  profiles:
    active: local
  application:
    name: P-Prism
  ai:
#    mcp:
#      client:
#        stdio:
#          servers-configuration: classpath:mcp-server.json
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          # 可通过环境变量 AI_CHAT_MODEL 切换模型，避免每次改代码
          model: ${AI_CHAT_MODEL:qwen4-max}
          multi-model: true
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
  datasource:
    url: jdbc:postgresql://localhost:5433/p-prism
    username: postgres
    password: root
server:
  port: 8123
  servlet:
    context-path: /api
# 可用模型清单：接口可通过 model 参数指定，默认使用 default-model
p-prism:
  ai:
    default-model: ${AI_CHAT_MODEL:qwen4-max}
    models:
      - qwen4-max
      - qwen3.8-flash
      - kimi-k3.1-pro
      - qwen3.8-max-0902
      - deepseek-v4.1-flash-1017
      - deepseek-v4.1-flash
      - glm-5.3
      - qwen3.8-omni-flash
      - qwen3.8-omni-flash-realtime
      - qwen-mt-uni
    # 当前应用暂未使用图片生成模型，仅登记备查
    image-models:
      - qwen-image-2.1-pro
      - qwen-mt-image-2.0
      - qwen-image-2.1-turbo
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.pp.pprism.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
